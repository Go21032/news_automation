name: Baycurrent Daily News Digest

# 毎朝8:00(JST)に起動し、時事ニュース収集→回答例生成→Googleスプレッドシート書き込みまでを実行する。
# 「思考」を要する収集・要約・回答例生成はClaude Code(Sonnet/Opus)が担当し、
# スプレッドシートへの書き込みは scripts/write_to_sheet.py が決定的に行う。

on:
  schedule:
    # cron はUTC基準。08:00 JST = 23:00 UTC(前日)
    - cron: '0 23 * * *'
  workflow_dispatch: {} # 手動実行・動作確認用

jobs:
  collect-and-log:
    runs-on: ubuntu-latest
    # 1軸あたり最大5本(合計最大20本)に増量したため、探索・要約・回答生成の時間が
    # 従来(1軸1本、9〜10分程度)より伸びる想定で余裕を持たせている。
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write # claude-code-action@v1 がOIDCトークン取得に必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Restore Google service account credentials
        run: |
          echo "${{ secrets.GOOGLE_SA_JSON_BASE64 }}" | base64 -d > "${{ runner.temp }}/sa.json"

      - name: Load prompt from PROMPT.md
        id: load_prompt
        run: |
          {
            echo 'content<<PROMPT_EOF'
            cat PROMPT.md
            echo PROMPT_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude Code (news collection + draft answers)
        uses: anthropics/claude-code-action@v1
        # NOTE: claude-code-action の入力名は変更される可能性があるため、
        # 導入時に https://github.com/anthropics/claude-code-action の最新READMEを確認すること。
        # v1では prompt_file / allowed_tools は廃止され、prompt / claude_args に統合された(2026-09時点)。
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token を明示的に渡すことで、OIDC→「Claude Code」GitHub App
          # トークン交換(このリポジトリには未インストールで401になる)をスキップする。
          # このワークフローはPR/コメント等のGitHub書き込み機能を使わないため、
          # 既定の GITHUB_TOKEN で十分。
          github_token: ${{ github.token }}
          prompt: ${{ steps.load_prompt.outputs.content }}
          claude_args: |
            --allowedTools "WebSearch,WebFetch,Bash,Read,Write"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TZ: Asia/Tokyo

      - name: Upload output.json (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-json-${{ github.run_id }}
          path: output.json
          if-no-files-found: warn
          retention-days: 14
